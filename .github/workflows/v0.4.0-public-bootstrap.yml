name: Verify the public v0.4.0 one-click installer
on:
  push:
    branches: [codex/verify-public-v0.4.0-bootstrap]
permissions:
  contents: read
jobs:
  one-click:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CA_GITHUB_PROXY_FIRST: '0'
      CA_GITHUB_PROXY_URL: ''
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Install the public ZIP and generate an AppSpec
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          if [[ "$PLATFORM" == darwin-arm64 ]]; then test "$(uname -m)" = arm64; fi
          raw=https://raw.githubusercontent.com/inclavare-containers/confidential-agent/one-click/one-click/install.sh
          curl -fsSL --retry 2 "$raw" -o "$RUNNER_TEMP/install.sh"
          sh -s -- deploy --non-interactive --yes --skip-deploy --skip-host-client \
            --harness codex --image-id m-example --api-key smoke-only \
            --state-dir "$RUNNER_TEMP/state" < "$RUNNER_TEMP/install.sh"
          cagent="$XDG_DATA_HOME/cagent/releases/cagent-deploy-0.4.0-$PLATFORM/bin/cagent"
          "$cagent" --version | grep -Fx 'confidential-agent 0.4.0'
          "$cagent" --state-dir "$RUNNER_TEMP/state" spec validate \
            --spec "$RUNNER_TEMP/state/one-click/codex/instance.yaml"
