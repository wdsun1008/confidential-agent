schema: confidential-agent/v1

service:
  id: claude-code
  ports: []
  connect: []

build:
  image_name: claude-code-agent
  resize: 30G
  with_network: true
  packages: [ca-certificates, curl, git, jq, nodejs, npm, tar, xz]
  files:
    - source: ../../target/debug/cai-pep
      target: /usr/local/bin/cai-pep
      executable: true
    - source: ../cli-agents/files/install-cli-agent-runtime.sh
      target: /usr/local/libexec/confidential-agent/cli-agent/install-cli-agent-runtime.sh
      executable: true
    - source: ../cli-agents/files/tdx-remote-attestation.SKILL.md
      target: /root/.claude/skills/tdx-remote-attestation/SKILL.md
  scripts: [./install-claude-code.sh]
  variants:
    release:
      enabled: true
    debug:
      enabled: true

deploy:
  provider: aliyun
  image_variant: debug
  instance_type: ecs.g9i.xlarge
  region: cn-beijing
  zone_id: cn-beijing-i
  disk_gb: 60

attestation:
  tee: tdx
  mode: challenge
  reference_values: rekor
  rekor:
    cosign_key: ./cosign.key
    slsa_generator: /usr/libexec/shelter/slsa/slsa-generator
    required: true

resources:
  claude_settings:
    source: ./secrets/settings.json
    target: /root/.claude/settings.json
    mode: "0600"
    required: true
  claude_onboarding:
    source: ./secrets/claude.json
    target: /root/.claude.json
    mode: "0600"
    required: true
