schema: confidential-agent/v1

service:
  id: hermes-agent
  ports: [8642]
  connect: [8642]
  app_service: shelter-container-hermes-agent.service

build:
  image_name: hermes-agent
  resize: 30G
  with_network: true
  container:
    image: nousresearch/hermes-agent:v2026.6.5
    mode: rootfs
    runtime: containerd
    name: hermes-agent
    pull: missing
    env:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: replace-with-openssl-rand-hex-32
      DASHSCOPE_API_KEY: replace-with-dashscope-api-key
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      HERMES_HOME: /opt/data
      HERMES_MODEL: qwen3.7-max
    working_dir: /opt/data
    network: true
  packages: [ca-certificates, curl, jq]
  scripts: [./prepare-hermes-data.sh]
  variants:
    release:
      enabled: false
    debug:
      enabled: true

deploy:
  provider: aliyun
  image_variant: debug
  instance_type: ecs.g9i.xlarge
  region: cn-beijing
  zone_id: cn-beijing-i
  disk_gb: 200

attestation:
  tee: tdx
  mode: challenge
  reference_values: sample

resources: {}
