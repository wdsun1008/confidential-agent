schema: confidential-agent/v1

service:
  id: hermes-agent
  ports: [8642]
  connect: [8642]
  app_service: shelter-container-hermes-agent.service

build:
  image_name: hermes-agent
  resize: 30G
  with_network: true
  container:
    image: nousresearch/hermes-agent:v2026.6.5
    mode: runtime
    runtime: podman
    name: hermes-agent
    pull: missing
    command:
      - gateway
      - run
    env:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      DASHSCOPE_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      HERMES_HOME: /opt/data
      HERMES_MODEL: qwen3.7-max
    working_dir: /opt/hermes
    network: true
    mounts:
      - source: /var/lib/confidential-agent/hermes-agent/data
        target: /opt/data
        read_only: false
  packages: [ca-certificates, curl, jq]
  variants:
    release:
      enabled: true
    debug:
      enabled: false

deploy:
  provider: aliyun
  image_variant: release
  instance_type: ecs.g9i.xlarge
  region: cn-beijing
  zone_id: cn-beijing-i
  disk_gb: 30

attestation:
  tee: tdx
  mode: challenge
  reference_values: sample

resources:
  hermes_env:
    source: ./secrets/hermes.env
    target: /var/lib/confidential-agent/hermes-agent/data/.env
    owner: "10000"
    group: "10000"
    mode: "0600"
  hermes_config:
    source: ./secrets/config.yaml
    target: /var/lib/confidential-agent/hermes-agent/data/config.yaml
    owner: "10000"
    group: "10000"
    mode: "0600"
    mutable: true
